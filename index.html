<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주간·월간 스터디 플래너(1-2)</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-bg: #eff6ff;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --done: #16a34a;
      --done-bg: #dcfce7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 56px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }
    .topbar-inner { max-width: 640px; margin: 0 auto; }
    .period-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .nav-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .period-info { text-align: center; }
    .period-main { font-size: 15px; font-weight: 700; }
    .period-sub { font-size: 12px; color: var(--muted); }
    .user-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .user-select-wrap { display: flex; align-items: center; gap: 6px; flex: 1; }
    .user-label { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
    select, input[type="text"], input[type="date"] {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }
    #memberSelect { flex: 1; max-width: 220px; }
    .refresh-btn {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 14px 16px 0; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .overall-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .bar-track {
      height: 7px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--done);
      transition: width 0.25s ease;
    }
    .main-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .main-tab-btn {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }
    .main-tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .submode-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .submode-group {
      display: inline-flex;
      background: var(--bg);
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--border);
    }
    .submode-btn {
      border: none;
      background: transparent;
      padding: 5px 12px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }
    .submode-btn.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }
    .add-box {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .add-box select { width: 82px; flex-shrink: 0; }
    .add-box input[type="date"] { width: 138px; flex-shrink: 0; font-size: 13px; }
    .add-box input[type="text"] { flex: 1; min-width: 150px; }
    .add-box button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 14px;
      min-height: 36px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 14px;
    }
    .cal-cell {
      min-height: 58px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 4px;
      background: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }
    .cal-cell.muted {
      background: #f8fafc;
      color: #cbd5e1;
    }
    .cal-cell.selected {
      border-color: var(--primary);
      background: var(--primary-bg);
    }
    .cal-cell.today .cal-num {
      background: var(--primary);
      color: #fff;
      border-radius: 999px;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .cal-num { font-size: 12px; font-weight: 700; }
    .cal-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #334155;
    }
    .cal-badge.all-done {
      background: var(--done-bg);
      color: var(--done);
    }
    .selected-date-head {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .task-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 2px;
      border-bottom: 1px solid var(--border);
    }
    .task-row:last-child { border-bottom: none; }
    .task-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
    }
    .day-chip {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--primary-bg);
      color: var(--primary);
      flex-shrink: 0;
    }
    .date-chip {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      flex-shrink: 0;
    }
    .task-label {
      flex: 1;
      font-size: 14px;
      word-break: break-word;
    }
    .task-label.done {
      text-decoration: line-through;
      color: var(--muted);
    }
    .del-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 15px;
      padding: 4px 6px;
      cursor: pointer;
    }
    .member-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .member-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      min-height: 28px;
    }
    .member-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 96px;
    }
    .member-name { font-size: 14px; font-weight: 700; }
    .done-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--done-bg);
      color: var(--done);
    }
    .member-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 240px;
    }
    .mini-track {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .mini-fill {
      height: 100%;
      background: var(--done);
    }
    .member-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      min-width: 46px;
      text-align: right;
    }
    .caret { font-size: 11px; color: var(--muted); width: 12px; text-align: center; }
    .member-detail {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .empty-msg {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 20px 8px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="period-row">
        <button class="nav-btn" onclick="shiftPeriod(-1)">◀ 이전</button>
        <div class="period-info">
          <div class="period-main" id="periodTitle">2026-W48</div>
          <div class="period-sub" id="periodSub">11/23(월) ~ 11/29(일)</div>
        </div>
        <button class="nav-btn" onclick="shiftPeriod(1)">다음 ▶</button>
      </div>
      <div class="user-row">
        <div class="user-select-wrap">
          <span class="user-label">내 이름</span>
          <select id="memberSelect" onchange="onSelectMember(this.value)">
            <option value="">불러오는 중...</option>
          </select>
        </div>
        <button class="refresh-btn" onclick="loadData()">↻ 새로고침</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="overall-head">
        <span id="overallTitle">이번 주 전체 달성률</span>
        <span id="overallStat">0% (0/0)</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="overallBar"></div>
      </div>
    </div>

    <div class="main-tabs">
      <button class="main-tab-btn active" id="btnMyTab" onclick="switchMainTab('my')">내 플래너</button>
      <button class="main-tab-btn" id="btnAllTab" onclick="switchMainTab('all')">전체 현황</button>
    </div>

    <!-- 내 플래너 -->
    <section id="mySection" class="card">
      <div class="submode-bar">
        <div class="submode-group">
          <button class="submode-btn active" id="btnWeekMode" onclick="setMyMode('week')">주간 보기</button>
          <button class="submode-btn" id="btnMonthMode" onclick="setMyMode('month')">월간 보기</button>
        </div>
        <button class="refresh-btn" onclick="goToday()">오늘로 이동</button>
      </div>

      <!-- 주간 보기 영역 -->
      <div id="weekModePanel">
        <div class="add-box">
          <select id="weekDaySelect">
            <option value="WEEK">주간</option>
            <option value="MON">월</option>
            <option value="TUE">화</option>
            <option value="WED">수</option>
            <option value="THU">목</option>
            <option value="FRI">금</option>
            <option value="SAT">토</option>
            <option value="SUN">일</option>
          </select>
          <input id="weekTaskInput" type="text" placeholder="이번 주 할 일 입력" onkeydown="if(event.key==='Enter') createWeekTask()" />
          <button onclick="createWeekTask()">추가</button>
        </div>
        <div id="weekTasksContainer"></div>
      </div>

      <!-- 월간 보기 영역 -->
      <div id="monthModePanel" class="hidden">
        <div class="cal-weekdays">
          <span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span>
        </div>
        <div class="cal-grid" id="monthCalendar"></div>

        <div class="selected-date-head">
          <span id="selectedDateLabel">선택한 날짜 할 일</span>
        </div>
        <div class="add-box">
          <input id="monthDateInput" type="date" onchange="onPickDateInput(this.value)" />
          <input id="monthTaskInput" type="text" placeholder="해당 날짜 할 일 입력" onkeydown="if(event.key==='Enter') createMonthTask()" />
          <button onclick="createMonthTask()">추가</button>
        </div>
        <div id="monthTasksContainer"></div>
      </div>
    </section>

    <!-- 전체 현황 -->
    <section id="allSection" class="hidden"></section>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyw9zWgGto7y_LAPuYCxmMYVGEbYy3AnKBiAiH45PykG8AXVM6Li6wh8d7DgQ4jOA5-/exec';

    const DAY_NAME = {
      WEEK: '주간', MON: '월', TUE: '화', WED: '수',
      THU: '목', FRI: '금', SAT: '토', SUN: '일'
    };
    const DAY_SORT = ['WEEK', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
    const WEEKDAY_CODES = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

    let anchorDate = new Date();
    let selectedDateStr = toDateStr(new Date());
    let myMode = 'week';
    let members = [];
    let tasks = [];
    let currentMemberId = localStorage.getItem('planner_member_id') || '';
    let expandedIds = new Set();

    function toDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function parseDateStr(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function getWeekKeyFromDate(date) {
      const utc = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = utc.getUTCDay() || 7;
      utc.setUTCDate(utc.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(utc.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((utc - yearStart) / 86400000) + 1) / 7);
      return `${utc.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    function getWeekMeta(date) {
      const weekKey = getWeekKeyFromDate(date);
      const mon = new Date(date);
      const offset = (mon.getDay() === 0 ? -6 : 1) - mon.getDay();
      mon.setDate(mon.getDate() + offset);
      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);
      const fmt = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
      return { weekKey, dateRange: `${fmt(mon)}(월) ~ ${fmt(sun)}(일)` };
    }

    function parseTaskContent(rawContent) {
      const match = String(rawContent || '').match(/^\[(\d{4}-\d{2}-\d{2})\]\s*(.*)$/);
      if (match) {
        return { dateStr: match[1], text: match[2] };
      }
      return { dateStr: '', text: String(rawContent || '') };
    }

    function packTaskContent(dateStr, text) {
      return dateStr ? `[${dateStr}] ${text}` : text;
    }

    function renderHeader() {
      if (myMode === 'week') {
        const meta = getWeekMeta(anchorDate);
        document.getElementById('periodTitle').textContent = meta.weekKey;
        document.getElementById('periodSub').textContent = meta.dateRange;
      } else {
        const y = anchorDate.getFullYear();
        const m = anchorDate.getMonth() + 1;
        document.getElementById('periodTitle').textContent = `${y}년 ${m}월`;
        document.getElementById('periodSub').textContent = '날짜를 선택해 월간 계획 확인';
      }
      document.getElementById('monthDateInput').value = selectedDateStr;
    }

    function shiftPeriod(dir) {
      if (myMode === 'week') {
        anchorDate.setDate(anchorDate.getDate() + dir * 7);
      } else {
        anchorDate = new Date(anchorDate.getFullYear(), anchorDate.getMonth() + dir, 1);
        selectedDateStr = toDateStr(anchorDate);
      }
      renderHeader();
      loadData();
    }

    function goToday() {
      anchorDate = new Date();
      selectedDateStr = toDateStr(new Date());
      renderHeader();
      loadData();
    }

    function setMyMode(mode) {
      myMode = mode;
      document.getElementById('btnWeekMode').classList.toggle('active', mode === 'week');
      document.getElementById('btnMonthMode').classList.toggle('active', mode === 'month');
      document.getElementById('weekModePanel').classList.toggle('hidden', mode !== 'week');
      document.getElementById('monthModePanel').classList.toggle('hidden', mode !== 'month');
      renderHeader();
      loadData();
    }

    function onPickDateInput(val) {
      if (!val) return;
      selectedDateStr = val;
      const picked = parseDateStr(val);
      anchorDate = new Date(picked.getFullYear(), picked.getMonth(), picked.getDate());
      renderHeader();
      renderView();
    }

    function onSelectMember(id) {
      currentMemberId = id;
      localStorage.setItem('planner_member_id', id);
      renderView();
    }

    function switchMainTab(tab) {
      const isMy = tab === 'my';
      document.getElementById('btnMyTab').classList.toggle('active', isMy);
      document.getElementById('btnAllTab').classList.toggle('active', !isMy);
      document.getElementById('mySection').classList.toggle('hidden', !isMy);
      document.getElementById('allSection').classList.toggle('hidden', isMy);
    }

    async function loadData() {
      const target = document.getElementById('weekTasksContainer');
      target.innerHTML = '<div class="empty-msg">불러오는 중...</div>';

      const query = myMode === 'week'
        ? `?week=${encodeURIComponent(getWeekKeyFromDate(anchorDate))}`
        : '';

      try {
        const res = await fetch(`${API_URL}${query}`, { redirect: 'follow' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.status === 'ok') {
          members = data.members || [];
          tasks = data.tasks || [];
          populateMembers();
          renderView();
        } else {
          throw new Error(data.message || '응답 오류');
        }
      } catch (e) {
        document.getElementById('memberSelect').innerHTML = '<option value="">불러오기 실패</option>';
        target.innerHTML = `<div class="empty-msg">시트 데이터를 불러오지 못했습니다. (${escapeHtml(e.message)})</div>`;
      }
    }

    function populateMembers() {
      const select = document.getElementById('memberSelect');
      select.innerHTML = '<option value="">이름 선택</option>' +
        members.map(m => `<option value="${escapeAttr(m.member_id)}" ${m.member_id === currentMemberId ? 'selected' : ''}>${escapeHtml(m.name)}</option>`).join('');
    }

    function getMonthTasksForMember(memberId) {
      const prefix = `${anchorDate.getFullYear()}-${String(anchorDate.getMonth() + 1).padStart(2, '0')}-`;
      return tasks.filter(t => {
        if (memberId && t.member_id !== memberId) return false;
        const parsed = parseTaskContent(t.content);
        if (parsed.dateStr) return parsed.dateStr.startsWith(prefix);
        return false;
      });
    }

    function sortByDay(list) {
      return [...list].sort((a, b) => DAY_SORT.indexOf(a.day) - DAY_SORT.indexOf(b.day));
    }

    function renderView() {
      const activePool = myMode === 'week'
        ? tasks
        : getMonthTasksForMember('');
      const totalCount = activePool.length;
      const doneCount = activePool.filter(t => t.is_done).length;
      const rate = totalCount ? Math.round((doneCount / totalCount) * 100) : 0;
      document.getElementById('overallTitle').textContent = myMode === 'week'
        ? '이번 주 전체 달성률'
        : `${anchorDate.getMonth() + 1}월 날짜별 전체 달성률`;
      document.getElementById('overallStat').textContent = `${rate}% (${doneCount}/${totalCount})`;
      document.getElementById('overallBar').style.width = `${rate}%`;

      if (!currentMemberId) {
        document.getElementById('weekTasksContainer').innerHTML = '<div class="empty-msg">상단에서 내 이름을 먼저 선택해 주세요.</div>';
        document.getElementById('monthTasksContainer').innerHTML = '<div class="empty-msg">상단에서 내 이름을 먼저 선택해 주세요.</div>';
      } else if (myMode === 'week') {
        renderWeekList();
      } else {
        renderMonthCalendarAndList();
      }

      renderAllMembers();
    }

    function renderWeekList() {
      const container = document.getElementById('weekTasksContainer');
      const mine = sortByDay(tasks.filter(t => t.member_id === currentMemberId));
      if (!mine.length) {
        container.innerHTML = '<div class="empty-msg">이번 주 등록된 할 일이 없습니다.</div>';
        return;
      }
      container.innerHTML = mine.map(t => {
        const parsed = parseTaskContent(t.content);
        return `
          <div class="task-row">
            <input type="checkbox" ${t.is_done ? 'checked' : ''} onchange="toggleTask('${escapeAttr(t.task_id)}')" />
            <span class="day-chip">${DAY_NAME[t.day] || '주간'}</span>
            ${parsed.dateStr ? `<span class="date-chip">${parsed.dateStr.slice(5)}</span>` : ''}
            <span class="task-label ${t.is_done ? 'done' : ''}">${escapeHtml(parsed.text)}</span>
            <button class="del-btn" onclick="removeTask('${escapeAttr(t.task_id)}')" aria-label="삭제">✕</button>
          </div>
        `;
      }).join('');
    }

    function renderMonthCalendarAndList() {
      const year = anchorDate.getFullYear();
      const month = anchorDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startOffset = (firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1);
      const totalCells = Math.ceil((startOffset + lastDay.getDate()) / 7) * 7;
      const todayStr = toDateStr(new Date());

      const myMonthTasks = getMonthTasksForMember(currentMemberId);
