<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주간·월간 스터디 플래너(1-2)</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-bg: #eff6ff;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --done: #16a34a;
      --done-bg: #dcfce7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 56px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }
    .topbar-inner { max-width: 640px; margin: 0 auto; }
    .period-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .nav-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .period-info { text-align: center; }
    .period-main { font-size: 15px; font-weight: 700; }
    .period-sub { font-size: 12px; color: var(--muted); min-height: 16px; }
    .user-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .user-select-wrap { display: flex; align-items: center; gap: 6px; flex: 1; }
    .user-label { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
    select, input[type="text"] {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }
    #memberSelect { flex: 1; max-width: 220px; }
    .refresh-btn {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .sync-status {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      min-height: 16px;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 14px 16px 0; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .overall-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .bar-track {
      height: 7px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--done);
      transition: width 0.25s ease;
    }
    .main-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .main-tab-btn {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }
    .main-tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .submode-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .submode-group {
      display: inline-flex;
      background: var(--bg);
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--border);
    }
    .submode-btn {
      border: none;
      background: transparent;
      padding: 5px 12px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }
    .submode-btn.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }
    .add-box {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .add-box select { width: 82px; flex-shrink: 0; }
    .add-box input { flex: 1; min-width: 0; }
    .add-box button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    .task-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 2px;
      border-bottom: 1px solid var(--border);
    }
    .task-row:last-child { border-bottom: none; }
    .task-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
    }
    .day-chip {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--primary-bg);
      color: var(--primary);
      flex-shrink: 0;
    }
    .status-chip {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .status-chip.done {
      background: var(--done-bg);
      color: var(--done);
    }
    .status-chip.todo {
      background: #f1f5f9;
      color: var(--muted);
    }
    .task-label {
      flex: 1;
      font-size: 14px;
      word-break: break-word;
    }
    .task-label.done {
      text-decoration: line-through;
      color: var(--muted);
    }
    .del-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 15px;
      padding: 4px 6px;
      cursor: pointer;
    }
    .week-group {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fcfcfd;
    }
    .week-group:last-child { margin-bottom: 0; }
    .week-group-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .week-group-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .week-group-range {
      font-size: 11px;
      color: var(--muted);
      margin-left: 6px;
    }
    .week-group-stat {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
    }
    .readonly-note {
      font-size: 12px;
      color: var(--muted);
      background: var(--bg);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }
    .member-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .member-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      min-height: 28px;
    }
    .member-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 96px;
    }
    .member-name { font-size: 14px; font-weight: 700; }
    .done-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--done-bg);
      color: var(--done);
    }
    .member-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 240px;
    }
    .mini-track {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .mini-fill {
      height: 100%;
      background: var(--done);
    }
    .member-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      min-width: 46px;
      text-align: right;
    }
    .caret { font-size: 11px; color: var(--muted); width: 12px; text-align: center; }
    .member-detail {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .empty-msg {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 20px 8px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="period-row">
        <button class="nav-btn" onclick="shiftPeriod(-1)">◀ 이전</button>
        <div class="period-info">
          <div class="period-main" id="periodTitle">2026-W48</div>
          <div class="period-sub" id="periodSub">11/23(월) ~ 11/29(일)</div>
        </div>
        <button class="nav-btn" onclick="shiftPeriod(1)">다음 ▶</button>
      </div>
      <div class="user-row">
        <div class="user-select-wrap">
          <span class="user-label">내 이름</span>
          <select id="memberSelect" onchange="onSelectMember(this.value)">
            <option value="">선택하세요</option>
          </select>
        </div>
        <button class="refresh-btn" onclick="loadData(true)">↻ 새로고침</button>
      </div>
      <div class="sync-status" id="syncStatus"></div>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="overall-head">
        <span id="overallTitle">이번 주 전체 달성률</span>
        <span id="overallStat">0% (0/0)</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="overallBar"></div>
      </div>
    </div>

    <div class="main-tabs">
      <button class="main-tab-btn active" id="btnMyTab" onclick="switchMainTab('my')">내 플래너</button>
      <button class="main-tab-btn" id="btnAllTab" onclick="switchMainTab('all')">전체 현황</button>
    </div>

    <!-- 내 플래너 -->
    <section id="mySection" class="card">
      <div class="submode-bar">
        <div class="submode-group">
          <button class="submode-btn active" id="btnWeekMode" onclick="setMyMode('week')">주간 보기</button>
          <button class="submode-btn" id="btnMonthMode" onclick="setMyMode('month')">월간 보기</button>
        </div>
        <button class="refresh-btn" onclick="goToday()">이번 주로</button>
      </div>

      <!-- 주간 보기: 입력 및 체크 -->
      <div id="weekModePanel">
        <div class="add-box">
          <select id="weekDaySelect">
            <option value="WEEK">주간</option>
            <option value="MON">월</option>
            <option value="TUE">화</option>
            <option value="WED">수</option>
            <option value="THU">목</option>
            <option value="FRI">금</option>
            <option value="SAT">토</option>
            <option value="SUN">일</option>
          </select>
          <input id="weekTaskInput" type="text" placeholder="이번 주 할 일 입력" onkeydown="if(event.key==='Enter') createWeekTask()" />
          <button onclick="createWeekTask()">추가</button>
        </div>
        <div id="weekTasksContainer"></div>
      </div>

      <!-- 월간 보기: 주간 기록 및 성취 열람 전용 -->
      <div id="monthModePanel" class="hidden">
        <div class="readonly-note">월간 보기는 해당 월에 속한 주간 계획과 완료 내역을 한눈에 돌아보는 열람 화면입니다.</div>
        <div id="monthSummaryContainer"></div>
      </div>
    </section>

    <!-- 전체 현황 -->
    <section id="allSection" class="hidden"></section>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyw9zWgGto7y_LAPuYCxmMYVGEbYy3AnKBiAiH45PykG8AXVM6Li6wh8d7DgQ4jOA5-/exec';
    const CACHE_MEMBERS_KEY = 'planner_cache_members_v1';
    const CACHE_TASKS_PREFIX = 'planner_cache_tasks_v2_';

    const DAY_NAME = {
      WEEK: '주간', MON: '월', TUE: '화', WED: '수',
      THU: '목', FRI: '금', SAT: '토', SUN: '일'
    };
    const DAY_SORT = ['WEEK', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];

    let anchorDate = new Date();
    let myMode = 'week';
    let members = [];
    let tasks = [];
    let currentMemberId = localStorage.getItem('planner_member_id') || '';
    let expandedIds = new Set();
    let isFetching = false;

    function getWeekKeyFromDate(date) {
      const utc = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = utc.getUTCDay() || 7;
      utc.setUTCDate(utc.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(utc.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((utc - yearStart) / 86400000) + 1) / 7);
      return `${utc.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    function getWeekRangeByDate(date) {
      const mon = new Date(date);
      const offset = (mon.getDay() === 0 ? -6 : 1) - mon.getDay();
      mon.setDate(mon.getDate() + offset);
      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);
      const fmt = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
      return {
        weekKey: getWeekKeyFromDate(date),
        mon,
        sun,
        rangeText: `${fmt(mon)}(월) ~ ${fmt(sun)}(일)`
      };
    }

    function getWeeksInMonth(year, monthIndex) {
      const firstOfMonth = new Date(year, monthIndex, 1);
      const lastOfMonth = new Date(year, monthIndex + 1, 0);

      const firstMonOffset = (firstOfMonth.getDay() === 0 ? -6 : 1) - firstOfMonth.getDay();
      let curMon = new Date(year, monthIndex, 1 + firstMonOffset);

      const result = [];
      const seen = new Set();
      while (curMon <= lastOfMonth) {
        const info = getWeekRangeByDate(curMon);
        if (!seen.has(info.weekKey)) {
          seen.add(info.weekKey);
          result.push(info);
        }
        curMon = new Date(curMon.getFullYear(), curMon.getMonth(), curMon.getDate() + 7);
      }
      return result;
    }

    function getCurrentCacheKey() {
      return myMode === 'week'
        ? `${CACHE_TASKS_PREFIX}week_${getWeekKeyFromDate(anchorDate)}`
        : `${CACHE_TASKS_PREFIX}all_tasks`;
    }

    function saveCache(key, list) {
      try {
        localStorage.setItem(key, JSON.stringify({ ts: Date.now(), list }));
      } catch (_) {}
    }

    function readCache(key) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (_) {
        return null;
      }
    }

    function setSyncStatus(msg) {
      document.getElementById('syncStatus').textContent = msg || '';
    }

    function renderHeader() {
      const goTodayBtn = document.querySelector('.submode-bar .refresh-btn');
      if (myMode === 'week') {
        const meta = getWeekRangeByDate(anchorDate);
        document.getElementById('periodTitle').textContent = meta.weekKey;
        document.getElementById('periodSub').textContent = meta.rangeText;
        if (goTodayBtn) goTodayBtn.textContent = '이번 주로';
      } else {
        const y = anchorDate.getFullYear();
        const m = anchorDate.getMonth() + 1;
        document.getElementById('periodTitle').textContent = `${y}년 ${m}월`;
        document.getElementById('periodSub').textContent = '';
        if (goTodayBtn) goTodayBtn.textContent = '이번 달로';
      }
    }

    function shiftPeriod(dir) {
      if (myMode === 'week') {
        anchorDate = new Date(anchorDate.getFullYear(), anchorDate.getMonth(), anchorDate.getDate() + dir * 7);
      } else {
        anchorDate = new Date(anchorDate.getFullYear(), anchorDate.getMonth() + dir, 1);
      }
      renderHeader();
      loadData(false);
    }

    function goToday() {
      anchorDate = new Date();
      renderHeader();
      loadData(false);
    }

    function setMyMode(mode) {
      myMode = mode;
      document.getElementById('btnWeekMode').classList.toggle('active', mode === 'week');
      document.getElementById('btnMonthMode').classList.toggle('active', mode === 'month');
      document.getElementById('weekModePanel').classList.toggle('hidden', mode !== 'week');
      document.getElementById('monthModePanel').classList.toggle('hidden', mode !== 'month');
      renderHeader();
      loadData(false);
    }

    function onSelectMember(id) {
      currentMemberId = id;
      localStorage.setItem('planner_member_id', id);
      renderView();
    }

    function switchMainTab(tab) {
      const isMy = tab === 'my';
      document.getElementById('btnMyTab').classList.toggle('active', isMy);
      document.getElementById('btnAllTab').classList.toggle('active', !isMy);
      document.getElementById('mySection').classList.toggle('hidden', !isMy);
      document.getElementById('allSection').classList.toggle('hidden', isMy);
    }

    function hydrateFromCacheFirst() {
      const cachedMembers = readCache(CACHE_MEMBERS_KEY);
      if (cachedMembers && Array.isArray(cachedMembers.list) && cachedMembers.list.length) {
        members = cachedMembers.list;
        populateMembers();
      }
      const cachedTasks = readCache(getCurrentCacheKey());
      if (cachedTasks && Array.isArray(cachedTasks.list)) {
        tasks = cachedTasks.list;
        renderView();
        return true;
      }
      return false;
    }

    async function loadData(forceNotice = false) {
      const hasCache = hydrateFromCacheFirst();
      if (!hasCache) {
        const targetId = myMode === 'week' ? 'weekTasksContainer' : 'monthSummaryContainer';
        document.getElementById(targetId).innerHTML = '<div class="empty-msg">시트 데이터를 불러오는 중...</div>';
      }
      if (isFetching) return;
      isFetching = true;
      setSyncStatus(forceNotice ? '최신 데이터 동기화 중...' : '백그라운드 동기화 중...');

      const query = myMode === 'week'
        ? `?week=${encodeURIComponent(getWeekKeyFromDate(anchorDate))}`
        : '';

      try {
        const res = await fetch(`${API_URL}${query}`, { redirect: 'follow' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.status === 'ok') {
          members = data.members || [];
          tasks = data.tasks || [];
          saveCache(CACHE_MEMBERS_KEY, members);
          saveCache(getCurrentCacheKey(), tasks);
          populateMembers();
          renderView();
          const now = new Date();
          setSyncStatus(`동기화 완료 (${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')})`);
        } else {
          throw new Error(data.message || '응답 오류');
        }
      } catch (e) {
        setSyncStatus(`동기화 실패: ${e.message}`);
        if (!hasCache) {
          const targetId = myMode === 'week' ? 'weekTasksContainer' : 'monthSummaryContainer';
          document.getElementById(targetId).innerHTML = `<div class="empty-msg">데이터를 불러오지 못했습니다. (${escapeHtml(e.message)})</div>`;
        }
      } finally {
        isFetching = false;
      }
    }

    function populateMembers() {
      const select = document.getElementById('memberSelect');
      const prev = select.value || currentMemberId;
      select.innerHTML = '<option value="">이름 선택</option>' +
        members.map(m => `<option value="${escapeAttr(m.member_id)}" ${m.member_id === prev ? 'selected' : ''}>${escapeHtml(m.name)}</option>`).join('');
    }

    function getScopedTasksForMember(memberId) {
      if (myMode === 'week') {
        const curWeekKey = getWeekKeyFromDate(anchorDate);
        return tasks.filter(t => t.week_key === curWeekKey && (!memberId || t.member_id === memberId));
      }
      const monthWeeks = new Set(getWeeksInMonth(anchorDate.getFullYear(), anchorDate.getMonth()).map(w => w.weekKey));
      return tasks.filter(t => monthWeeks.has(t.week_key) && (!memberId || t.member_id === memberId));
    }

    function sortByDay(list) {
      return [...list].sort((a, b) => DAY_SORT.indexOf(a.day) - DAY_SORT.indexOf(b.day));
    }

    function renderView() {
      const pool = getScopedTasksForMember('');
      const totalCount = pool.length;
      const doneCount = pool.filter(t => t.is_done).length;
      const rate = totalCount ? Math.round((doneCount / totalCount) * 100) : 0;

      document.getElementById('overallTitle').textContent = myMode === 'week'
        ? '이번 주 전체 달성률'
        : `${anchorDate.getMonth() + 1}월 주간 기록 달성률`;
      document.getElementById('overallStat').textContent = `${rate}% (${doneCount}/${totalCount})`;
      document.getElementById('overallBar').style.width = `${rate}%`;

      if (myMode === 'week') {
        renderWeekEditorList();
      } else {
        renderMonthReadonlySummary();
      }

      renderAllMembers();
    }

    function renderWeekEditorList() {
      const container = document.getElementById('weekTasksContainer');
      if (!currentMemberId) {
        container.innerHTML = '<div class="empty-msg">상단에서 내 이름을 먼저 선택해 주세요.</div>';
        return;
      }
      const mine = sortByDay(getScopedTasksForMember(currentMemberId));
      if (!mine.length) {
        container.innerHTML = '<div class="empty-msg">이번 주 등록된 할 일이 없습니다.</div>';
        return;
      }
      container.innerHTML = mine.map(t => `
        <div class="task-row">
          <input type="checkbox" ${t.is_done ? 'checked' : ''} onchange="toggleTask('${escapeAttr(t.task_id)}')" />
          <span class="day-chip">${DAY_NAME[t.day] || '주간'}</span>
          <span class="task-label ${t.is_done ? 'done' : ''}">${escapeHtml(t.content)}</span>
          <button class="del-btn" onclick="removeTask('${escapeAttr(t.task_id)}')" aria-label="삭제">✕</button>
        </div>
      `).join('');
    }

    function renderMonthReadonlySummary() {
      const container = document.getElementById('monthSummaryContainer');
      if (!currentMemberId) {
        container.innerHTML = '<div class="empty-msg">상단에서 내 이름을 먼저 선택해 주세요.</div>';
        return;
      }

      const weeks = getWeeksInMonth(anchorDate.getFullYear(), anchorDate.getMonth());
      const myTasks = getScopedTasksForMember(currentMemberId);

      const blocksHtml = weeks.map(w => {
        const wTasks = sortByDay(myTasks.filter(t => t.week_key === w.weekKey));
        const wDone = wTasks.filter(t => t.is_done).length;

        const rowsHtml = !wTasks.length
          ? '<div class="empty-msg" style="padding:10px 0;">이 주간에 등록된 기록이 없습니다.</div>'
          : wTasks.map(t => `
              <div class="task-row">
                <span class="status-chip ${t.is_done ? 'done' : 'todo'}">${t.is_done ? '완료' : '미완료'}</span>
                <span class="day-chip">${DAY_NAME[t.day] || '주간'}</span>
                <span class="task-label ${t.is_done ? 'done' : ''}">${escapeHtml(t.content)}</span>
              </div>
            `).join('');

        return `
          <div class="week-group">
            <div class="week-group-head">
              <div>
                <span class="week-group-title">${escapeHtml(w.weekKey)}</span>
                <span class="week-group-range">${escapeHtml(w.rangeText)}</span>
              </div>
              <span class="week-group-stat">${wDone} / ${wTasks.length} 완료</span>
            </div>
            ${rowsHtml}
          </div>
        `;
      }).join('');

      container.innerHTML = blocksHtml || '<div class="empty-msg">표시할 주간 기록이 없습니다.</div>';
    }

    function renderAllMembers() {
      const allContainer = document.getElementById('allSection');
      if (!members.length) {
        allContainer.innerHTML = '<div class="card empty-msg">등록된 멤버가 없습니다.</div>';
        return;
      }

      allContainer.innerHTML = members.map(m => {
        const mTasks = sortByDay(getScopedTasksForMember(m.member_id));
        const mTotal = mTasks.length;
        const mDone = mTasks.filter(t => t.is_done).length;
        const mPct = mTotal ? Math.round((mDone / mTotal) * 100) : 0;
        const isAllDone = mTotal > 0 && mDone === mTotal;
        const isOpen = expandedIds.has(m.member_id);
        const canEdit = myMode === 'week' && m.member_id === currentMemberId;

        const detailRows = !mTotal
          ? '<div class="empty-msg" style="padding:10px 0;">등록된 항목이 없습니다.</div>'
          : mTasks.map(t => `
              <div class="task-row">
                <input type="checkbox" ${t.is_done ? 'checked' : ''} ${canEdit ? '' : 'disabled'} onchange="toggleTask('${escapeAttr(t.task_id)}')" />
                ${myMode === 'month' ? `<span class="day-chip">${escapeHtml(t.week_key.split('-')[1] || t.week_key)}</span>` : ''}
                <span class="day-chip">${DAY_NAME[t.day] || '주간'}</span>
                <span class="task-label ${t.is_done ? 'done' : ''}">${escapeHtml(t.content)}</span>
              </div>
            `).join('');

        return `
          <div class="member-card">
            <div class="member-summary" onclick="toggleCard('${escapeAttr(m.member_id)}')">
              <div class="member-left">
                <span class="member-name">${escapeHtml(m.name)}</span>
                ${isAllDone ? '<span class="done-pill">완료</span>' : ''}
              </div>
              <div class="member-right">
                <div class="mini-track"><div class="mini-fill" style="width:${mPct}%"></div></div>
                <span class="member-count">${mDone}/${mTotal}</span>
                <span class="caret">${isOpen ? '▲' : '▼'}</span>
              </div>
            </div>
            <div class="member-detail ${isOpen ? '' : 'hidden'}">${detailRows}</div>
          </div>
        `;
      }).join('');
    }

    function toggleCard(id) {
      if (expandedIds.has(id)) expandedIds.delete(id);
      else expandedIds.add(id);
      renderAllMembers();
    }

    async function sendPost(body) {
      const res = await fetch(API_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      });
      return res.json();
    }

    async function createWeekTask() {
      if (!currentMemberId) return alert('상단에서 내 이름을 먼저 선택해 주세요.');
      const input = document.getElementById('weekTaskInput');
      const text = input.value.trim();
      if (!text) return;

      const day = document.getElementById('weekDaySelect').value;
      const weekKey = getWeekKeyFromDate(anchorDate);
      const tempId = 'temp_' + Date.now();

      tasks.push({ task_id: tempId, week_key: weekKey, member_id: currentMemberId, day, content: text, is_done: false });
      input.value = '';
      renderView();
      saveCache(getCurrentCacheKey(), tasks);

      setSyncStatus('저장 중...');
      try {
        const res = await sendPost({ action: 'add', week_key: weekKey, member_id: currentMemberId, day, content: text });
        if (res && res.task_id) {
          const item = tasks.find(t => t.task_id === tempId);
          if (item) item.task_id = res.task_id;
        }
        saveCache(getCurrentCacheKey(), tasks);
        setSyncStatus('저장 완료');
      } catch (_) {
        setSyncStatus('저장 지연 — 새로고침으로 확인해 주세요');
      }
    }

    async function toggleTask(taskId) {
      const item = tasks.find(t => t.task_id === taskId);
      if (!item) return;
      item.is_done = !item.is_done;
      renderView();
      saveCache(getCurrentCacheKey(), tasks);
      try {
        await sendPost({ action: 'toggle', task_id: taskId });
      } catch (_) {
        setSyncStatus('체크 반영 지연 — 새로고침해 주세요');
      }
    }

    async function removeTask(taskId) {
      if (!confirm('삭제할까요?')) return;
      tasks = tasks.filter(t => t.task_id !== taskId);
      renderView();
      saveCache(getCurrentCacheKey(), tasks);
      try {
        await sendPost({ action: 'delete', task_id: taskId });
      } catch (_) {
        setSyncStatus('삭제 반영 지연 — 새로고침해 주세요');
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function escapeAttr(str) {
      return String(str).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
    }

    renderHeader();
    loadData(false);
  </script>
</body>
</html>
